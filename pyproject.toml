[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfl"
version = "0.1.0"
description = "margin-and-financing-lab: prime-broker allocation under a transparent margin proxy (synthetic data)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cvxpy>=1.6",
    "highspy",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# step 6 (report) adds: duckdb

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
